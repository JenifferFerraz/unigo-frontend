name: unigo_mobile
description: A new Flutter project for UniGo University App.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.6

  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_tts: ^4.2.3
  flutter_secure_storage: ^9.0.0
  google_maps_flutter: ^2.5.0
  google_sign_in: ^7.1.1
  flutter_facebook_auth: ^7.1.1
  mobile_scanner: ^3.5.6
  flutter_local_notifications: ^19.4.1
  local_auth: ^2.1.8

  flutter_svg: ^2.0.9
  http: ^1.2.0
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  url_launcher: ^6.2.2
  permission_handler: ^12.0.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  geolocator: ^14.0.2 
  image_picker: ^1.0.4
  flutter_image_compress: ^2.1.0
  flutter_dotenv: ^6.0.0
  cloudinary_public: ^0.23.1
  universal_html: ^2.2.4
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geojson/
    - assets/images/
    - assets/icons/
    - .env
